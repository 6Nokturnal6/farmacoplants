services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Public (browser) env vars — inlined at build time
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY}
        VITE_SUPABASE_PROJECT_ID: ${VITE_SUPABASE_PROJECT_ID}
    image: farmacoplants-app:latest
    container_name: farmacoplants-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Server-side env vars — read at runtime
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}

  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: farmacoplants-uptime-kuma
    restart: unless-stopped
    volumes:
      - uptime-kuma-data:/app/data
    ports:
      # Bind to localhost only — expose via reverse proxy at
      # status.farmacoplants.unilurio.ac.mz (see DEPLOY.md).
      - "127.0.0.1:3001:3001"

volumes:
  uptime-kuma-data:
